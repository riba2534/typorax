<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TyporaX</title>
  </head>
  <body>
    <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9 4.5v15M6 8h.1M6 11h.1"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-document" viewBox="0 0 24 24"><path d="M14 3.5H6a1.5 1.5 0 0 0-1.5 1.5v14A1.5 1.5 0 0 0 6 20.5h12a1.5 1.5 0 0 0 1.5-1.5V9L14 3.5Z"/><path d="M14 3.5V9h5.5M8 13h8M8 16.5h6"/></symbol>
        <symbol id="i-open" viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-4M13 3h8v8M21 3 11 13"/></symbol>
        <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7V5.5A1.5 1.5 0 0 1 5 4h4l2 2h8A1.5 1.5 0 0 1 20.5 7.5V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18V7ZM3.5 9h17"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></symbol>
        <symbol id="i-focus" viewBox="0 0 24 24"><path d="M8 3.5H3.5V8M16 3.5h4.5V8M3.5 16v4.5H8M16 20.5h4.5V16"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></symbol>
        <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
        <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="i-bullets" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.1M4 12h.1M4 18h.1"/></symbol>
        <symbol id="i-numbers" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M3 4l2-1v5M3 13a2 2 0 1 1 3 1.7L3 18h4"/></symbol>
        <symbol id="i-task" viewBox="0 0 24 24"><rect x="3.5" y="5" width="6.5" height="6.5" rx="1"/><path d="m5 8 1.5 1.5L9 6.5M14 8h6M14 17h6M4 17h6"/></symbol>
        <symbol id="i-quote" viewBox="0 0 24 24"><path d="M9 7H4v6h5V7ZM4 13c0 3 1 4 3 5M20 7h-5v6h5V7ZM15 13c0 3 1 4 3 5"/></symbol>
        <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6M16 6l6 6-6 6M14 3l-4 18"/></symbol>
        <symbol id="i-link" viewBox="0 0 24 24"><path d="m9 15 6-6M8 16l-1 1a3.5 3.5 0 0 1-5-5l5-5a3.5 3.5 0 0 1 5 0M16 8l1-1a3.5 3.5 0 0 1 5 5l-5 5a3.5 3.5 0 0 1-5 0" transform="translate(0 -1)"/></symbol>
        <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m3 17 5-4 4 3 4-6 5 6"/></symbol>
        <symbol id="i-save" viewBox="0 0 24 24"><path d="M18 3.5H5A1.5 1.5 0 0 0 3.5 5v14A1.5 1.5 0 0 0 5 20.5h14a1.5 1.5 0 0 0 1.5-1.5V6L18 3.5ZM7 3.5v6h10v-6M7 20.5V14h10v6.5"/></symbol>
        <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12m-4-8 4-4 4 4M4 13v6a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 19v-6"/></symbol>
      </defs>
    </svg>

    <aside id="sidebar" aria-label="文档与大纲">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>#</span><i></i></div>
        <div class="brand-wordmark"><strong>TyporaX</strong><span>MARKDOWN</span></div>
        <span class="brand-version">本地写作</span>
      </div>

      <div class="sidebar-actions">
        <button id="new-document" class="primary-button" title="新建文档（⌘N）"><svg class="icon"><use href="#i-plus"/></svg><span>新建文档</span><kbd>⌘N</kbd></button>
        <button id="open-file" class="icon-button open-file-button" title="打开 Markdown 文件（⌘O）" aria-label="打开 Markdown 文件"><svg class="icon"><use href="#i-open"/></svg></button>
      </div>

      <button id="open-folder" class="folder-button" title="选择一个本地文件夹">
        <svg class="icon"><use href="#i-folder"/></svg><span id="folder-label">打开文件夹</span><svg class="icon chevron"><use href="#i-chevron"/></svg>
      </button>

      <nav class="sidebar-tabs" role="tablist" aria-label="侧栏视图">
        <button data-sidebar-tab="files" class="active" role="tab" aria-selected="true" aria-controls="file-list">文档</button>
        <button data-sidebar-tab="outline" role="tab" aria-selected="false" aria-controls="outline-list">大纲</button>
      </nav>

      <div class="file-search-wrap"><svg class="icon"><use href="#i-search"/></svg><input id="file-search" type="search" placeholder="查找文档" aria-label="查找文档" autocomplete="off" spellcheck="false"/></div>
      <div class="sidebar-content">
        <div id="file-list" class="file-list" role="list" aria-label="文档列表"></div>
        <div id="outline-list" class="outline-list" aria-label="当前文档大纲" hidden></div>
      </div>

      <div class="sidebar-footer"><span class="local-indicator"><i></i>存于本机</span><span><kbd>⌘O</kbd> 打开文件</span></div>
    </aside>

    <main class="workspace">
      <header class="workspace-toolbar">
        <div class="toolbar-leading">
          <button id="toggle-sidebar" class="icon-button" title="显示或隐藏侧栏" aria-label="显示或隐藏侧栏"><svg class="icon"><use href="#i-sidebar"/></svg></button>
          <span class="toolbar-divider"></span>
          <div class="document-heading"><span id="document-name">未命名文档</span><span id="save-indicator" role="status">草稿</span></div>
        </div>
        <div class="toolbar-trailing">
          <button id="toggle-source" class="text-button source-button" title="切换 Markdown 源码（⌘/）" aria-pressed="false"><svg class="icon"><use href="#i-code"/></svg><span>源码</span></button>
          <span class="toolbar-divider"></span>
          <button id="focus-mode" class="icon-button" title="专注模式" aria-label="切换专注模式" aria-pressed="false"><svg class="icon"><use href="#i-focus"/></svg></button>
          <button id="theme-toggle" class="icon-button" title="切换明暗主题" aria-label="切换明暗主题"><svg class="icon"><use href="#i-moon"/></svg></button>
          <button id="more-menu-toggle" class="icon-button" title="更多操作" aria-label="更多操作" aria-expanded="false" aria-controls="more-menu"><svg class="icon"><use href="#i-more"/></svg></button>
        </div>
      </header>

      <div id="format-toolbar" class="format-toolbar" role="toolbar" aria-label="文本格式">
        <div class="format-group">
          <button data-format="heading1" title="一级标题" aria-label="一级标题">H<span class="subscript">1</span></button>
          <button data-format="heading2" title="二级标题" aria-label="二级标题">H<span class="subscript">2</span></button>
          <button data-format="heading3" title="三级标题" aria-label="三级标题">H<span class="subscript">3</span></button>
        </div>
        <span class="toolbar-divider"></span>
        <div class="format-group">
          <button data-format="bold" title="加粗（⌘B）" aria-label="加粗"><strong>B</strong></button>
          <button data-format="italic" title="斜体（⌘I）" aria-label="斜体"><em>I</em></button>
          <button data-format="strike" title="删除线" aria-label="删除线"><s>S</s></button>
          <button data-format="link" title="插入链接（⌘K）" aria-label="插入链接"><svg class="icon"><use href="#i-link"/></svg></button>
        </div>
        <span class="toolbar-divider"></span>
        <div class="format-group">
          <button data-format="bulletList" title="无序列表" aria-label="无序列表"><svg class="icon"><use href="#i-bullets"/></svg></button>
          <button data-format="orderedList" title="有序列表" aria-label="有序列表"><svg class="icon"><use href="#i-numbers"/></svg></button>
          <button data-format="taskList" title="待办列表" aria-label="待办列表"><svg class="icon"><use href="#i-task"/></svg></button>
        </div>
        <span class="toolbar-divider"></span>
        <div class="format-group">
          <button data-format="blockquote" title="引用" aria-label="引用"><svg class="icon"><use href="#i-quote"/></svg></button>
          <button data-format="codeBlock" title="代码块" aria-label="代码块"><svg class="icon"><use href="#i-code"/></svg></button>
          <button data-format="table" title="插入表格" aria-label="插入表格"><svg class="icon"><use href="#i-table"/></svg></button>
          <button data-format="horizontalRule" title="分隔线" aria-label="分隔线"><span class="rule-icon"></span></button>
        </div>
      </div>

      <div id="more-menu" class="popover-menu" role="menu" aria-label="文档操作" hidden>
        <div class="menu-caption">文档</div>
        <button data-action="save" role="menuitem"><svg class="icon"><use href="#i-save"/></svg><span>保存</span><kbd>⌘S</kbd></button>
        <button data-action="saveAs" role="menuitem"><span class="menu-spacer"></span><span>另存为…</span><kbd>⌘⇧S</kbd></button>
        <div class="menu-separator"></div>
        <button data-action="exportHTML" role="menuitem"><svg class="icon"><use href="#i-export"/></svg><span>导出 HTML…</span></button>
        <button data-action="exportPDF" role="menuitem"><span class="menu-spacer"></span><span>导出 PDF…</span></button>
        <div class="menu-separator"></div>
        <button data-action="insertTable" role="menuitem"><svg class="icon"><use href="#i-table"/></svg><span>插入表格</span></button>
        <button data-action="insertImage" role="menuitem"><svg class="icon"><use href="#i-image"/></svg><span>插入图片…</span></button>
        <div class="menu-separator"></div>
        <button data-action="typewriter" role="menuitemcheckbox" aria-checked="false"><span class="menu-spacer typewriter-check">✓</span><span>打字机模式</span></button>
        <button data-action="shortcuts" role="menuitem"><span class="menu-spacer">⌘</span><span>键盘快捷键</span></button>
      </div>

      <section id="find-panel" class="find-panel" aria-label="查找与替换" hidden>
        <div class="find-row"><svg class="icon"><use href="#i-search"/></svg><input id="find-input" type="search" placeholder="查找文字" aria-label="查找文字" autocomplete="off"/><span id="find-count">0 / 0</span><button id="find-prev" class="icon-button" title="上一处" aria-label="上一处"><svg class="icon"><use href="#i-up"/></svg></button><button id="find-next" class="icon-button" title="下一处" aria-label="下一处"><svg class="icon"><use href="#i-down"/></svg></button><button id="close-find" class="icon-button" title="关闭查找（Esc）" aria-label="关闭查找"><svg class="icon"><use href="#i-close"/></svg></button></div>
        <div class="find-row replace-row"><span class="replace-symbol">↳</span><input id="replace-input" type="text" placeholder="替换为" aria-label="替换为" autocomplete="off"/><button id="replace-one" class="small-button">替换</button><button id="replace-all" class="small-button">全部替换</button></div>
      </section>

      <div id="editor-scroll" class="editor-scroll">
        <div id="editor" aria-label="Markdown 文档编辑器"></div>
        <div id="source-editor" aria-label="Markdown 源码编辑器" hidden></div>
      </div>

      <footer class="status-bar">
        <div class="status-leading"><span class="format-label">Markdown</span><span id="status-message" role="status" aria-live="polite">准备就绪</span></div>
        <div class="status-trailing"><span id="cursor-position"></span><span id="word-count">0 字</span><span class="status-dot">·</span><span id="char-count">0 字符</span><span class="status-dot">·</span><span id="reading-time">0 分钟阅读</span></div>
      </footer>
    </main>

    <div id="toast" role="status" aria-live="polite" hidden></div>

    <dialog id="input-dialog" class="input-dialog">
      <div class="dialog-eyebrow">TYPORAX / MARKDOWN</div>
      <label id="dialog-label" for="dialog-input">插入链接</label>
      <input id="dialog-input" type="text" autocomplete="off" spellcheck="false" placeholder="https://"/>
      <div class="dialog-actions"><button id="dialog-cancel" class="secondary-button" type="button">取消</button><button id="dialog-confirm" class="primary-button" type="button">确认</button></div>
    </dialog>

    <dialog id="shortcuts-dialog" class="shortcuts-dialog">
      <div class="dialog-title-row"><div><div class="dialog-eyebrow">KEEP YOUR HANDS ON THE KEYS</div><h2>键盘快捷键</h2></div><button id="close-shortcuts" class="icon-button" aria-label="关闭快捷键"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <dl class="shortcut-list"><div><dt>新建文档</dt><dd><kbd>⌘ N</kbd></dd></div><div><dt>打开文件</dt><dd><kbd>⌘ O</kbd></dd></div><div><dt>保存</dt><dd><kbd>⌘ S</kbd></dd></div><div><dt>另存为</dt><dd><kbd>⌘ ⇧ S</kbd></dd></div><div><dt>查找与替换</dt><dd><kbd>⌘ F</kbd></dd></div><div><dt>切换源码</dt><dd><kbd>⌘ /</kbd></dd></div><div><dt>加粗 / 斜体</dt><dd><kbd>⌘ B</kbd><kbd>⌘ I</kbd></dd></div><div><dt>插入链接</dt><dd><kbd>⌘ K</kbd></dd></div><div><dt>撤销 / 重做</dt><dd><kbd>⌘ Z</kbd><kbd>⌘ ⇧ Z</kbd></dd></div></dl>
      <p class="dialog-note">也可以直接输入 Markdown 标记，让格式随着文字出现。</p>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
